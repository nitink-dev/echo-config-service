apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathqa-svc
  namespace: pathqasvc-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pathqa-svc
  template:
    metadata:
      labels:
        app: pathqa-svc
    spec:
      serviceAccountName: pathqasvc-sa
      nodeSelector:
        cloud.google.com/gke-nodepool: eh-qa-io-perf-node-pool-2
      containers:
        - name: pathqa-svc
          image: us-central1-docker.pkg.dev/prj-d-dp/path-qa-service/sierra-dicom-analyser:20250912.1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 1000m
              memory: 750Mi
            limits:
              cpu: 1500m
              memory: 1.5Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
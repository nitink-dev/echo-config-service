apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathqa-svc
  namespace: pathqasvc-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pathqa-svc
  template:
    metadata:
      labels:
        app: pathqa-svc
    spec:
      serviceAccountName: pathqasvc-sa
      containers:
        - name: pathqa-svc
          image: PATHQA_IMAGE
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 1000m
              memory: 750Mi
            limits:
              cpu: 1500m
              memory: 1.5Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
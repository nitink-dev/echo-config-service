apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-svc
  namespace: adminsvc-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-svc
  template:
    metadata:
      labels:
        app: admin-svc
    spec:
      serviceAccountName: adminsvc-sa
      containers:
        - name: admin-svc
          image: IMAGE_PATH:__IMAGE_TAG__
          ports:
            - containerPort: 8097
          resources:
            requests:
              cpu: 750m
              memory: 2Gi
            limits:
              cpu: 1500m
              memory: 4Gi

          envFrom:
            - configMapRef:
                name: app-config

          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pathqasvc-sa
  namespace: pathqasvc-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-kafka-sec-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["initial-root-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-token-access
  namespace: vault
roleRef:
  kind: ClusterRole
  name: vault-kafka-sec-reader
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: pathqasvc-sa
    namespace: pathqasvc-ns